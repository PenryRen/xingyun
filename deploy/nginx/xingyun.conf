# ============================================================
# 麟航智训 / AI学习中心 — Nginx 统一反向代理配置
# 建议放在服务器上：/etc/nginx/conf.d/xingyun.conf
# 设计原则：
#   · 只对外暴露 80 / 443（HTTP/HTTPS）
#   · 所有后端端口（16000/16002/5000/...）一律不对外网开放
#   · 管理后台使用独立的 server_name（或路径 /admin）
#   · 加入限流、隐藏版本号、超时等安全配置
# ============================================================

# ----------------------------------------------------------------
# 全局安全与限流（如果已在 /etc/nginx/nginx.conf 中设置，可以移除）
# ----------------------------------------------------------------
# 请在 /etc/nginx/nginx.conf 的 http {} 块中启用：
#   server_tokens off;                 # 隐藏 nginx 版本
#   client_max_body_size 500m;         # 与后端文件上传阈值一致
#   proxy_read_timeout 300s;
#   proxy_send_timeout 300s;
#   proxy_connect_timeout 10s;
# ----------------------------------------------------------------

# 限流：AI 对话接口防止狂刷（令牌桶，每秒 2 次，突发 10）
limit_req_zone $binary_remote_addr zone=ai_rate:10m rate=2r/s;

# ============================================================
# 管理后台站点（推荐绑定独立域名，如 admin.你的域名.com）
# 也可以改成：listen 80; 然后访问 http://服务器IP/admin/
# ============================================================
server {
    listen 80;
    # server_name admin.你的域名.com;    # 如果有域名，启用这行，把 # 去掉

    server_tokens off;

    # ---- 管理后台前端静态资源 ----
    root  /opt/Xingyun/web/admin;
    index index.html;

    # SPA 路由回退：所有未命中的路径交给 index.html 处理，防止刷新 404
    location / {
        try_files $uri $uri/ /index.html;
        # 静态资源缓存
        add_header Cache-Control "public, max-age=3600, s-maxage=3600";
        if ($request_uri ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|ico)$) {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ---- /api/  →  管理后端（ueit-admin.jar，端口 16002） ----
    location /api/ {
        proxy_pass         http://127.0.0.1:16002;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        # 上传文件最大 500MB（与 Spring multipart 一致）
        client_max_body_size 500m;
    }

    # ---- 资源文件：/ueupload/  →  /opt/Xingyun/resource/web-file ----
    location /ueupload/ {
        alias  /opt/Xingyun/resource/web-file/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff";
    }

    # ---- 基本安全响应头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}


# ============================================================
# 用户前台 / AI学习中心站点
# 绑定主域名（如 www.你的域名.com 或服务器 IP）
# ============================================================
server {
    listen 80 default_server;
    # server_name www.你的域名.com 你的域名.com;

    server_tokens off;

    # ---- 用户前端静态资源 ----
    root  /opt/Xingyun/web/user;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        if ($request_uri ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|ico)$) {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # ---- /api/  →  用户后端（ueit-user-web.jar，端口 16000） ----
    location /api/ {
        proxy_pass         http://127.0.0.1:16000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        client_max_body_size 500m;
    }

    # ---- /ai-agent/  →  AI Agent 后端（Python，端口 5000，暂不部署） ----
    location /ai-agent/ {
        # 去掉 /ai-agent 前缀再转发
        rewrite ^/ai-agent/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        # SSE / 流式对话需要
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;

        # 限流：避免 AI 接口被狂刷
        limit_req zone=ai_rate burst=10 nodelay;
    }

    # ---- /api/ai/  →  同样转发到 AI Agent（vite.config.ts 中有这个前缀） ----
    location /api/ai/ {
        rewrite ^/api/ai/(.*)$ /learning/$1 break;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        proxy_read_timeout 300s;
        proxy_buffering off;
        limit_req zone=ai_rate burst=10 nodelay;
    }

    # ---- 资源文件 /ueupload/ ----
    location /ueupload/ {
        alias  /opt/Xingyun/resource/web-file/;
        autoindex off;
        add_header X-Content-Type-Options "nosniff";
    }

    # ---- 基本安全响应头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
