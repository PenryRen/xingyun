name: Test Docker Compose

on:
  push:
    branches: [ main, Docker-Dev ]
  pull_request:

jobs:
  test-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build services
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for service
        run: |
          for i in {1..30}; do
            docker compose ps
            if curl -f http://localhost:6001; then
              echo "Service is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Service failed to start"
          docker compose logs
          exit 1

      - name: Run user-web test
        run: |
          curl -f http://localhost:6001 || exit 1
      
      - name: Run admin-web test
        run: |
          curl -f http://localhost:6003 || exit 1
      
      #目前后端数据库初始化存在问题，暂时不进行测试
      # - name: Run user-backend test
      #   run: |
      #     curl -f http://localhost:16000 || exit 1

      # - name: Run admin-backend test
      #   run: |
      #     curl -f http://localhost:16002 || exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v