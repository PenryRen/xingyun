name: Deploy Backend

on:
  push:
    branches: [ "main", "Docker-Dev" ]
    paths:
      - 'WebBE/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-unified

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REGISTRY,IMAGE_NAME,ALIYUN_REGISTRY_USERNAME,ALIYUN_REGISTRY_PASSWORD
          script: |
            set -e
            echo "Login to Aliyun Registry..."
            echo "${ALIYUN_REGISTRY_PASSWORD}" | docker login "${REGISTRY}" -u "${ALIYUN_REGISTRY_USERNAME}" --password-stdin

            IMAGE="${REGISTRY}/${IMAGE_NAME}:latest"
            echo "Pull image: ${IMAGE}"
            docker pull "${IMAGE}"
            
            # Run unified container
            docker run -d \
              --name xingyun-unified \
              --restart unless-stopped \
              -p 80:80 \
              -p 6001:6001 \
              -p 6003:6003 \
              -p 6007:6007 \
              -v /etc/localtime:/etc/localtime:ro \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
              
