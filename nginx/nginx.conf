#为nginx自动分配核心
worker_processes auto;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    #日志输出到 stdout
    #access_log  /dev/stdout;
    #error_log   /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # gzip 优化
    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==================================================
    # 学生端
    # ==================================================
    server {
        listen 6001;
        server_name ueit-user-web;

        client_max_body_size 20m;

        location / {
            proxy_pass http://user:5001/;
            proxy_set_header Host $host;
        }

        # API 反向代理
        location /api/ {
            proxy_pass http://backend:16000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60;
        }

        # 浏览器只可读取 Agent 健康状态；聊天统一经过已登录的 WebBE。
        location = /ai-agent/health {
            proxy_pass http://agent:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 20;
        }

        location /ai-agent/ {
            return 404;
        }

        # 上传资源
        location /ueupload/ {
            alias /usr/share/nginx/html/resource/web-file/;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ==================================================
    # 管理端
    # ==================================================
    server {
        listen 6003;
        server_name ueit-admin;

        client_max_body_size 1024m;

        location / {
            proxy_pass http://admin:5002/;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://backend:16002;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300;
        }

        location /ueupload/ {
            alias /usr/share/nginx/html/resource/web-file/;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
