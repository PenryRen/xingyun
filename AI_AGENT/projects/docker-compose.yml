name: xingyun-agent-standalone

services:
  agent:
    build: .
    container_name: kylin-education-agent
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      # OpenAI 兼容模型配置
      - COZE_WORKLOAD_IDENTITY_API_KEY=${COZE_WORKLOAD_IDENTITY_API_KEY:-}
      - COZE_INTEGRATION_MODEL_BASE_URL=${COZE_INTEGRATION_MODEL_BASE_URL:-}
      - HTTP_PROXY=${AGENT_HTTP_PROXY:-}
      - HTTPS_PROXY=${AGENT_HTTPS_PROXY:-}
      - NO_PROXY=${AGENT_NO_PROXY:-localhost,127.0.0.1}

      # 工作目录
      - COZE_WORKSPACE_PATH=/app
      - COZE_DIRECT_DOH_ENABLED=${COZE_DIRECT_DOH_ENABLED:-false}
      - COZE_DOH_REFRESH_SECONDS=${COZE_DOH_REFRESH_SECONDS:-300}
      - COZE_LOOP_ENABLED=${COZE_LOOP_ENABLED:-false}

    volumes:
      # 挂载项目目录，方便开发时实时更新
      - ./src:/app/src
      - ./config:/app/config

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
