services:
  mysql:
    image: mysql:8.4.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wdd
      MYSQL_USER: wdd
      MYSQL_PASSWORD: wdd123
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-conf:/etc/mysql/conf.d
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --default-time-zone=+8:00
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly yes
      - --requirepass redis123
    restart: unless-stopped

  admin:
    build:
      context: ./WebFE/wdd-admin  # Dockerfile 所在目录
      dockerfile: Dockerfile
    image: xingyun/wdd-admin:latest
    ports:
      - "5002:5002"
    restart: unless-stopped
    depends_on:
      - backend

  user:
    build:
      context: ./WebFE/wdd-user-web
      dockerfile: Dockerfile
    image: xingyun/wdd-user-web:latest
    ports:
      - "5001:5001"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build:
      context: ./WebBE
      dockerfile: Dockerfile
    image: xingyun/backend:latest
    ports:
      - "16000:16000"
      - "16002:16002"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wdd?useSSL=false&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&allowMultiQueries=true
      SPRING_DATASOURCE_USERNAME: wdd
      SPRING_DATASOURCE_PASSWORD: wdd123
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redis123
      SPRING_REDIS_DATABASE: 1
    restart: unless-stopped
    depends_on:
      - mysql
      - redis

  nginx:
    build:
      context: ./Nginx
      dockerfile: Dockerfile
    image: xingyun/nginx:latest
    ports:
      - "6001:6001"
      - "6003:6003"
    restart: unless-stopped
    depends_on:
      - user
      - admin
      - backend

volumes:
  mysql-data:
  mysql-conf:
  redis-data: