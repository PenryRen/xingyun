system:
  resource:
    #本地存储，配合nginx使用
    local-store: true
    file:
      location: /app/course/resource/web-file
      url: http://jyptapp.ueweixin.com/ueupload/
    #违禁词过滤
    stop-word-path: /app/course/resource/stop-word
    stop-word-enabled: false

logging:
  file:
    path: ./log/ueit-user-mobile

spring:
  servlet:
    multipart:
      location: /app/course/resource/servlet
  redis:
    host: localhost
    database: 1
  datasource:
    url: jdbc:mysql://localhost:3306/wdd?useSSL=false&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
