server:
  port: 16002
  undertow:
    threads:
      io: 4
      worker: 16
    buffer-size: 1024
    direct-buffers: true
  compression:
    enabled: true
    min-response-size: 1
  error:
    path: /error

#logging logback
logging:
  config: classpath:logback-spring.xml
  file:
    name: ueit


mybatis-plus:
  type-aliases-package: com.mindskip.wdd.domain
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      table-prefix: t_


#spring datasource default HikariPool
spring:
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  datasource:
    hikari:
      idle-timeout: 600000  #10 min
      max-lifetime: 1800000 #30 min
      maximum-pool-size: 3
  redis:
    timeout: 10000 #超时时间
    database: 7 #0-15 16个库 默认0
    lettuce:
      pool:
        max-active: 8 #最大连接数
        max-wait: -1 #默认-1 最大连接阻塞等待时间
        max-idle: 8 #最大空闲连接 默认8
        min-idle: 0 #最小空闲连接
  cache:
    type: redis
    redis:
      time-to-live: 12h   #12 hour
  profiles:
#    active:  prod
    active:  dev



#libre-office
jodconverter:
  local:
    enabled: false
    port-numbers: 8100

vm-ware:
  config-key:
    #授权
    authConfigKey: sys.vm.auth
    #授权过期时间
    expirationConfigKey: sys.vm.expiration
    #虚拟机基础信息
    rootConfigKey: sys.vm.root
    #虚拟机硬盘信息
    diskConfigKey: sys.vm.disk
    #虚拟机上限个数
    maxCountConfigKey: sys.vm.maxCount
    #实训虚拟机时间限制 单位(分钟)
    trainTimeLimitConfigKey: sys.vm.trainTimeLimit
    #实训虚拟机过期时间限制 单位(分钟)
    expiredTimeLimitConfigKey: sys.vm.expiredTimeLimit
  api:
    #接口前缀
    urlPrefix: http://192.168.1.210:32080/
    #授权时间接口地址 Get
    expiration: api/v1/getProtected
    #获取虚拟化列表 Get
    list: api/v1/vms
    #虚拟机关机接口地址 Put
    shutdown: api/v1/vms/stop-virtual-machine
    #虚拟机开机接口地址 Put
    start: api/v1/vms/start-virtual-machine
    #虚拟机重启接口地址 Put
    reStart: api/v1/vms/restart-virtual-machine
    #虚拟机克隆接口地址 Post
    clone: api/v1/cloneLocalVM
    #虚拟机删除接口地址 Delete
    delete: api/v1/vms