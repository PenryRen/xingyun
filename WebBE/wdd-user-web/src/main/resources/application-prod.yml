system:
  resource:
    # 本地存储，配合 nginx 使用
    local-store: true
    file:
      location: /opt/Xingyun/resource/web-file
      url: /ueupload
    # 违禁词过滤
    stop-word-path: /opt/Xingyun/resource/stop-word
    stop-word-enabled: false
  # token 配置
  token:
    # 账户单点登录（true单点登录 false多终端登录）
    soloLogin: false

logging:
  file:
    path: ./log/ueit-user-web

spring:
  servlet:
    multipart:
      location: /opt/Xingyun/resource/servlet
  # 生产环境 Redis：支持通过环境变量覆盖
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:1}
    timeout: 10000
    lettuce:
      pool:
        # 2G 内存：调小连接池
        max-active: 4
        max-wait: 3000
        max-idle: 2
        min-idle: 0
  # 生产环境数据源：支持通过环境变量覆盖
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/wdd?useSSL=false&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&allowMultiQueries=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 2G 内存：调小连接池，避免 OOM
      idle-timeout: 300000      # 5 min
      max-lifetime: 1200000     # 20 min
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000
