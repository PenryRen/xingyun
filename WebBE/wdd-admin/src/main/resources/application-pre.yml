system:
  resource:
    #本地存储，配合nginx使用
    local-store: false
    file:
      location: /app/course/resource/web-file
      url: http://jyptad.ueweixin.com/ueupload/

logging:
  file:
    path: ./log/ueit-admin

jodconverter: #libreoffice安装路径
  local:
    enabled: false
    office-home: /opt/libreoffice7.4

spring:
  servlet:
    multipart:
      location: /app/course/resource/servlet
  redis:
    host: localhost
    database: 1
  datasource:
    url: jdbc:mysql://localhost:3306/wdd?useSSL=false&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
