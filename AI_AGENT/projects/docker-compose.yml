version: '3.8'

services:
  agent:
    build: .
    container_name: kylin-education-agent
    ports:
      - "8000:8000"
    environment:
      # Supabase 配置（需要替换为你的实际值）
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}

      # 豆包大模型配置（需要替换为你的实际值）
      - COZE_WORKLOAD_IDENTITY_API_KEY=${COZE_WORKLOAD_IDENTITY_API_KEY}
      - COZE_INTEGRATION_MODEL_BASE_URL=${COZE_INTEGRATION_MODEL_BASE_URL}

      # 工作目录
      - COZE_WORKSPACE_PATH=/app

    volumes:
      # 挂载项目目录，方便开发时实时更新
      - ./src:/app/src
      - ./config:/app/config

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
