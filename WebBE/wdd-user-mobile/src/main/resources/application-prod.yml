system:
  resource:
    #本地存储，配合nginx使用
    # 须与 nginx「location /ueupload/」的 alias 一致：${INSTALL_PREFIX}/resource/web-file（install.sh 默认 INSTALL_PREFIX=/opt/linhang）
    local-store: true
    file:
      location: /opt/linhang/resource/web-file
      url: /ueupload
    #违禁词过滤
    stop-word-path: /opt/linhang/resource/stop-word
    stop-word-enabled: false

logging:
  file:
    path: ./log/ueit-user-mobile

spring:
  servlet:
    multipart:
      location: /opt/linhang/resource/servlet
  redis:
    host: 127.0.0.1
    port: 6379
    password: redis123
    database: 1
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wdd?useSSL=false&useUnicode=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: wdd
    password: wdd123
    driver-class-name: com.mysql.cj.jdbc.Driver
